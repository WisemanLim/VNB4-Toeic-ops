# ============================================================================
# CI DISABLED — 2026-05-21
# ----------------------------------------------------------------------------
# 본 파일은 ops 영역의 CI 정본(source of truth)이며, 현재 비활성화 상태입니다.
# GitHub Actions가 직접 실행하지는 않습니다 (.github/workflows 경로 외).
# 운영 정책 변경 시 본 파일과 .github/workflows/ci.yml 을 함께 복원하십시오.
#
# 재활성화 방법:
#   1) 본 파일 하단의 `ORIGINAL CONTENT BELOW` 블록에서 각 라인 앞 `# ` 제거
#      (sed 자동화 예시:
#         sed -n '/ORIGINAL CONTENT BELOW/,$p' github-actions-ci.yml \
#           | sed '1,2d' | sed 's/^# //' > github-actions-ci.yml.new
#         mv github-actions-ci.yml.new github-actions-ci.yml )
#   2) `.github/workflows/ci.yml` 를 본 파일 내용으로 sync (또는 동일 절차로 복원)
#   3) main 브랜치 push 또는 PR 발행으로 동작 확인
#
# 비활성화 이유: 외부 CI 사용 보류. 컴포넌트별 로컬 검증 스크립트로 대체.
# ============================================================================

name: ci-disabled
on:
  workflow_dispatch: {}

jobs:
  noop:
    runs-on: ubuntu-latest
    steps:
      - run: echo "CI disabled — restore VNB4-Toeic-ops/ci/github-actions-ci.yml to re-enable."

