# ============================================================================
# CI DISABLED — 2026-05-21
# ----------------------------------------------------------------------------
# 이 워크플로우는 현재 비활성화 상태입니다.
# GitHub Actions는 push/pull_request 트리거를 발견하지 못하면 실행하지 않으므로
# `on:` 블록이 주석 처리된 동안에는 어떤 잡도 실행되지 않습니다.
#
# 재활성화 방법:
#   1) 본 파일 36줄 이하 `# ORIGINAL CONTENT BELOW` 블록의 각 라인 앞 `# `를 제거
#      (또는 sed: `sed -i '' 's/^# //' .github/workflows/ci.yml` — DISABLED 헤더는
#       파일 상단을 잘라낸 후 실행할 것)
#   2) ops/ci/github-actions-ci.yml 도 동일하게 복원하여 두 파일을 sync
#   3) 첫 PR/push로 정상 동작 확인
#
# 비활성화 이유: 본 시점 외부 CI 러너 사용 보류. 로컬 검증은
# `VNB4-Toeic-app/test/run-tests.sh` 등 컴포넌트별 스크립트로 대체.
# ============================================================================

name: ci-disabled
on:
  workflow_dispatch: {}   # 수동 트리거 자리만 남김. 잡 정의는 아래 주석 안에 보존.

jobs:
  noop:
    runs-on: ubuntu-latest
    steps:
      - run: echo "CI disabled — restore .github/workflows/ci.yml to re-enable."

